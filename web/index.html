<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>企业订单智能分析</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;

    background: #ffffff;
    color: #2f2f2f;
}

body {
    display: flex;
    overflow: hidden;
}


/* =========================
   Sidebar
========================= */

.sidebar {

    width: 260px;
    height: 100vh;

    background: #f7f7f8;

    border-right: 1px solid #e5e5e5;

    padding: 12px;

    display: flex;
    flex-direction: column;
}


.logo {

    display: flex;
    align-items: center;

    gap: 10px;

    padding: 10px 8px 20px;

    font-weight: 600;
}


.logo-icon {

    width: 30px;
    height: 30px;

    border-radius: 8px;

    background: #2f2f2f;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 12px;
}


.new-chat {

    width: 100%;

    padding: 10px;

    border-radius: 8px;

    border: 1px solid #d9d9d9;

    background: white;

    cursor: pointer;

    text-align: left;

    font-size: 14px;
}


.new-chat:hover {
    background: #eeeeee;
}


.section-title {

    margin-top: 20px;

    padding: 8px;

    color: #888;

    font-size: 12px;
}


.menu-item {

    padding: 9px;

    border-radius: 7px;

    font-size: 13px;

    color: #555;
}


.menu-item:hover {
    background: #eeeeee;
}


.sidebar-bottom {

    margin-top: auto;

    padding: 12px 8px;

    border-top: 1px solid #e5e5e5;

    color: #888;

    font-size: 12px;
}


/* =========================
   Main
========================= */

.main {

    flex: 1;

    height: 100vh;

    min-width: 0;

    display: flex;

    flex-direction: column;
}


.topbar {

    height: 58px;

    padding: 0 24px;

    border-bottom: 1px solid #eeeeee;

    display: flex;

    align-items: center;

    font-size: 15px;

    font-weight: 600;
}


.subtitle {

    margin-left: 8px;

    color: #999;

    font-size: 12px;

    font-weight: normal;
}


/* =========================
   Messages
========================= */

.messages {

    flex: 1;

    overflow-y: auto;

    padding: 40px 20px 170px;
}


.welcome {

    max-width: 760px;

    margin: 100px auto;

    text-align: center;
}


.welcome h1 {

    font-size: 28px;

    margin-bottom: 12px;
}


.welcome p {

    color: #888;

    font-size: 14px;
}


.message {

    max-width: 820px;

    margin: 0 auto 30px;

    display: flex;

    gap: 14px;
}


.message.user {

    justify-content: flex-end;
}


.avatar {

    width: 32px;
    height: 32px;

    flex-shrink: 0;

    border-radius: 8px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 12px;

    font-weight: 600;
}


.avatar.ai {

    background: #2f2f2f;

    color: white;
}


.avatar.user {

    background: #eeeeee;

    color: #555;

    order: 2;
}


.content {

    max-width: 75%;

    font-size: 15px;

    line-height: 1.7;

    white-space: pre-wrap;

    word-break: break-word;
}


.user .content {

    order: 1;

    background: #f1f1f1;

    padding: 10px 15px;

    border-radius: 18px;
}


/* =========================
   Composer
========================= */

.composer-wrapper {

    position: fixed;

    left: 260px;
    right: 0;
    bottom: 0;

    padding: 18px 20px 22px;

    background:
        linear-gradient(
            to bottom,
            rgba(255,255,255,0),
            rgba(255,255,255,0.95) 35%,
            white 65%
        );
}


.composer {

    max-width: 820px;

    margin: auto;

    border: 1px solid #d9d9d9;

    border-radius: 18px;

    background: white;

    padding: 10px 12px;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.06);
}


.composer-row {

    display: flex;

    align-items: center;

    gap: 8px;
}


#input {

    flex: 1;

    border: none;

    outline: none;

    resize: none;

    height: 40px;

    max-height: 120px;

    padding: 9px 4px;

    font-family: inherit;

    font-size: 15px;
}


.icon-button {

    width: 36px;
    height: 36px;

    border: none;

    background: transparent;

    border-radius: 9px;

    cursor: pointer;

    font-size: 20px;

    color: #555;
}


.icon-button:hover {
    background: #eeeeee;
}


.send-button {

    width: 36px;
    height: 36px;

    border: none;

    border-radius: 10px;

    background: #2f2f2f;

    color: white;

    cursor: pointer;

    font-size: 16px;
}


.send-button:disabled {

    background: #cccccc;

    cursor: default;
}


.file-name {

    display: none;

    padding: 4px 8px 8px;

    font-size: 12px;

    color: #777;
}


.file-name.show {
    display: block;
}


.hint {

    max-width: 820px;

    margin: 8px auto 0;

    text-align: center;

    font-size: 11px;

    color: #999;
}


#file {
    display: none;
}


@media (max-width: 700px) {

    .sidebar {
        display: none;
    }

    .composer-wrapper {
        left: 0;
    }

    .content {
        max-width: 85%;
    }

}

/* 加载提示 */
.loading-message {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #666;
}

.loading-dots {
    display: flex;
    gap: 4px;
}

.loading-dots span {
    width: 6px;
    height: 6px;
    background: #888;
    border-radius: 50%;
    animation: loading-bounce 1.4s infinite ease-in-out both;
}

.loading-dots span:nth-child(1) {
    animation-delay: -0.32s;
}

.loading-dots span:nth-child(2) {
    animation-delay: -0.16s;
}

@keyframes loading-bounce {
    0%, 80%, 100% {
        transform: scale(0);
    }

    40% {
        transform: scale(1);
    }
}

/* =========================
   Markdown 内容样式
========================= */

.content h1,
.content h2,
.content h3 {
    margin-top: 16px;
    margin-bottom: 10px;
}

.content p {
    margin: 8px 0;
    line-height: 1.7;
}

.content ul,
.content ol {
    margin: 8px 0;
    padding-left: 24px;
    line-height: 1.7;
}

.content table {
    border-collapse: collapse;
    margin: 12px 0;
    width: 100%;
}

.content th,
.content td {
    border: 1px solid #ddd;
    padding: 8px 12px;
    text-align: left;
}

.content th {
    background: #f5f5f5;
    font-weight: 600;
}

.content strong {
    font-weight: 600;
}

.content code {
    background: #f1f1f1;
    padding: 2px 5px;
    border-radius: 4px;
}

.content pre {
    background: #f5f5f5;
    padding: 12px;
    border-radius: 8px;
    overflow-x: auto;
}
</style>

</head>


<body>


<aside class="sidebar">

    <div class="logo">

        <div class="logo-icon">
            AI
        </div>

        企业订单助手

    </div>


    <button
        class="new-chat"
        onclick="newChat()">

        ＋ 新建对话

    </button>


    <div class="section-title">
        功能
    </div>


    <div class="menu-item">
        订单查询
    </div>

    <div class="menu-item">
        订单图片识别
    </div>

    <div class="menu-item">
        销售分析
    </div>

    <div class="menu-item">
        历史订单搜索
    </div>


    <div class="sidebar-bottom">
        企业订单智能分析系统<br>
        Local Development
    </div>

</aside>


<main class="main">

    <header class="topbar">

        企业订单智能分析

        <span class="subtitle">
            AI Assistant
        </span>

    </header>


    <section
        class="messages"
        id="messages">

        <div
            class="welcome"
            id="welcome">

            <h1>
                有什么可以帮您？
            </h1>

            <p>
                查询企业订单，分析销售数据，或上传订单图片。
            </p>

        </div>

    </section>

</main>


<div class="composer-wrapper">

    <div class="composer">

        <div
            id="file-name"
            class="file-name">
        </div>


        <div class="composer-row">


            <button
                class="icon-button"
                onclick="selectImage()"
                title="上传图片">

                ＋

            </button>


            <input
                type="file"
                id="file"
                accept="image/png,image/jpeg,image/webp"
                onchange="showSelectedImage()"
            >


            <textarea
                id="input"
                placeholder="给企业订单助手发送消息..."
                onkeydown="handleKey(event)">
            </textarea>


            <button
                id="send"
                class="send-button"
                onclick="sendMessage()">

                ↑

            </button>

        </div>

    </div>


    <div class="hint">

        Enter 发送 · Shift + Enter 换行 · 支持订单图片

    </div>

</div>


<script>

/* =========================
   Session ID
========================= */

let sessionId =
    localStorage.getItem(
        "doc_agent_session"
    );


if (!sessionId) {

    sessionId =
        crypto.randomUUID();

    localStorage.setItem(
        "doc_agent_session",
        sessionId
    );
}


/* =========================
   添加消息
========================= */

function addMessage(role, text) {

    const welcome =
        document.getElementById(
            "welcome"
        );

    if (welcome) {
        welcome.remove();
    }


    const messages =
        document.getElementById(
            "messages"
        );


    const row =
        document.createElement(
            "div"
        );

    row.className =
        "message " + role;


    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "avatar " + role;

    avatar.textContent =
        role === "assistant"
            ? "AI"
            : "你";


    const content =
        document.createElement(
            "div"
        );

    content.className =
        "content";

    if (role === "assistant") {

    content.innerHTML =
        marked.parse(text);

    } else {

        content.textContent =
            text;
    }


    row.appendChild(avatar);

    row.appendChild(content);

    messages.appendChild(row);


    messages.scrollTop =
        messages.scrollHeight;
}

/* =========================
   加载提示
========================= */

function addLoadingMessage() {

    const messages =
        document.getElementById("messages");

    const row =
        document.createElement("div");

    row.className =
        "message assistant";

    row.id =
        "loading-message";

    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar assistant";

    avatar.textContent =
        "AI";

    const content =
        document.createElement("div");

    content.className =
        "content";

    content.innerHTML = `
        <div class="loading-message">
            <span>AI 正在处理</span>

            <div class="loading-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    `;

    row.appendChild(avatar);
    row.appendChild(content);

    messages.appendChild(row);

    messages.scrollTop =
        messages.scrollHeight;
}


function removeLoadingMessage() {

    const loadingMessage =
        document.getElementById(
            "loading-message"
        );

    if (loadingMessage) {
        loadingMessage.remove();
    }
}

/* =========================
   Enter发送
========================= */

function handleKey(event) {

    if (
        event.key === "Enter"
        &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();
    }
}


/* =========================
   选择图片
========================= */

function selectImage() {

    document
        .getElementById("file")
        .click();
}


/* =========================
   显示选择的图片
========================= */

function showSelectedImage() {

    const file =
        document.getElementById(
            "file"
        ).files[0];

    const name =
        document.getElementById(
            "file-name"
        );


    if (!file) {
        return;
    }


    name.textContent =
        "已选择：" + file.name;

    name.classList.add("show");
}


/* =========================
   发送
========================= */

async function sendMessage() {

    const input =
        document.getElementById(
            "input"
        );

    const send =
        document.getElementById(
            "send"
        );

    const fileInput =
        document.getElementById(
            "file"
        );


    const message =
        input.value.trim();

    const file =
        fileInput.files[0];


    if (
        !message &&
        !file
    ) {
        return;
    }


    if (message) {

        addMessage(
            "user",
            message
        );

    }


    if (file) {

        addMessage(
            "user",
            "📎 " + file.name
        );

    }


    input.value = "";

    send.disabled = true;

    // 显示 AI 加载提示
    addLoadingMessage();

    const formData =
        new FormData();


    formData.append(
        "message",
        message
    );


    formData.append(
        "session_id",
        sessionId
    );


    if (file) {

        formData.append(
            "image",
            file
        );

    }


    try {

        const response =
            await fetch(
                "/chat",
                {
                    method: "POST",
                    body: formData
                }
            );


        const data =
            await response.json();

        removeLoadingMessage();

        if (data.session_id) {

            sessionId =
                data.session_id;

            localStorage.setItem(
                "doc_agent_session",
                sessionId
            );
        }


        if (data.reply) {

            addMessage(
                "assistant",
                data.reply
            );

        } else {

            addMessage(
                "assistant",
                "请求失败：" +
                (
                    data.error ||
                    "未知错误"
                )
            );
        }


    } catch (error) {

        removeLoadingMessage();

        addMessage(
            "assistant",
            "无法连接服务器：" +
            error
        );

    } finally {

        send.disabled = false;

        fileInput.value = "";

        const name =
            document.getElementById(
                "file-name"
            );

        name.textContent = "";

        name.classList.remove(
            "show"
        );

        input.focus();
    }
}


/* =========================
   新建对话
========================= */

async function newChat() {

    try {

        await fetch(
            "/clear",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    session_id:
                        sessionId
                })
            }
        );

    } catch (error) {

        console.log(error);

    }


    sessionId =
        crypto.randomUUID();


    localStorage.setItem(
        "doc_agent_session",
        sessionId
    );


    document.getElementById(
        "messages"
    ).innerHTML = `

        <div
            class="welcome"
            id="welcome">

            <h1>
                有什么可以帮您？
            </h1>

            <p>
                查询企业订单，分析销售数据，或上传订单图片。
            </p>

        </div>

    `;
}

</script>

</body>

</html>
